name: Dependency Canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scaffold dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run dependency canary
        run: bash scripts/canary_latest_deps.sh
