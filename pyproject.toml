[project]
name = "langchain-rag-scaffold"
version = "0.1.0"
description = "Scaffold for building LangChain RAG applications"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pydantic-settings>=2.0.0",
    "pymongo>=4.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: bootstraps a generated app and runs install/unit-test checks (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
